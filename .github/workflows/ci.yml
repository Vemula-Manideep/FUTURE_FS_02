name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server
        run: npm ci
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/test
          CLIENT_URL: http://localhost:5173
          JWT_ACCESS_SECRET: ci-access-secret-long-enough-for-validation
          JWT_REFRESH_SECRET: ci-refresh-secret-long-enough-for-validation

      - name: Install client
        run: npm install --include=optional
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client